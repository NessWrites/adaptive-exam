# For MacBook - Complete Docker setup
# This creates a self-contained environment that works on any Mac

services:
  db:
    image: postgres:15
    container_name: adaptive_exam_db
    environment:
      POSTGRES_DB: adaptive_exam_db
      POSTGRES_USER: fusemachines
      POSTGRES_PASSWORD: your_strong_password
    ports:
      - "5432:5432"  # Use standard port on Mac
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusemachines -d adaptive_exam_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: adaptive_exam_app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: adaptive_exam_db
      DB_USER: fusemachines
      DB_PASSWORD: your_strong_password
      STREAMLIT_SERVER_PORT: 8501
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  pgdata:
