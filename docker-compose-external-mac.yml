services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: adaptive_exam_app
    environment:
      # Connect to Mac's local PostgreSQL
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: adaptive_exam_db
      DB_USER: fusemachines
      DB_PASSWORD: your_strong_password
      STREAMLIT_SERVER_PORT: 8501
    ports:
      - "8501:8501"
    restart: unless-stopped
