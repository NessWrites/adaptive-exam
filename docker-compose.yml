

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    env_file: .env
    networks:
      - exam_network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test : ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
  

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fastapi_backend
    restart: unless-stopped
    env_file: .env
    networks:
      - exam_network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/adaptive_exam_db
    ports:
      - "8000:8000"
    # command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    command: bash -c "python -m alembic -c backend/alembic.ini upgrade head && python -m backend.app.database.postgresql.seed && python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
      - ./quiz_database.sql:/app/quiz_database.sql
    depends_on:
      db:
        condition: service_healthy
    
  # Streamlit Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streamlit_frontend
    restart: unless-stopped
    env_file: .env
    networks:
      - exam_network
    environment:
      - API_BASE_URL=http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - backend

networks:
  exam_network:
    driver: bridge
volumes:
  postgres_data:
