version: "3.9"

services:
  db:
    image: postgres:15
    container_name: adaptive_exam_db
    environment:
      POSTGRES_DB: ${DB_NAME:-adaptive_exam_db}
      POSTGRES_USER: ${DB_USER:-fusemachines}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_strong_password}
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: adaptive_exam_app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-adaptive_exam_db}
      DB_USER: ${DB_USER:-fusemachines}
      DB_PASSWORD: ${DB_PASSWORD:-your_strong_password}
      STREAMLIT_SERVER_PORT: ${STREAMLIT_SERVER_PORT:-8501}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    # Uncomment to enable live code reload in development
    # volumes:
    #   - .:/app

volumes:
  pgdata:
